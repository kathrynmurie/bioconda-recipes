{% set version = "0.1.0" %}

package:
  name: r-pgecore
  version: {{ version }}

source:
  url: https://github.com/PlasmoGenEpi/PGEcore/archive/refs/tags/v{{ version }}.tar.gz
  sha256: <SHA256_FROM_RELEASE_TARBALL>

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  run_exports:
    - {{ pin_subpackage("r-pgecore", max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}

  host:
    - r-base >=4.1.0
    - r-dplyr
    - r-optparse
    - r-purrr
    - r-readr
    - r-rlang
    - r-stringr
    - r-tibble
    - r-tidyr
    - r-validate

  run:
    - r-base >=4.1.0
    - r-dplyr
    - r-optparse
    - r-purrr
    - r-readr
    - r-rlang
    - r-stringr
    - r-tibble
    - r-tidyr
    - r-validate

test:
  commands:
    - $R -e "library('PGEcore')"

about:
  home: https://github.com/PlasmoGenEpi/PGEcore
  doc_url: https://plasmogenepi.github.io/PGEcore/
  summary: R tools for malaria genomics analysis
  description: >
    Provides R functions and command-line interfaces for malaria genomics
    analysis, including wrappers for specialised tools, shared TSV formats,
    naive complexity of infection (COI), allele frequency and prevalence
    estimators, filters, and format converters.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kathrynmurie
